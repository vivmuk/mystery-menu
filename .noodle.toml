mode = "auto"

# Execution: Codex CLI pointed at Venice. Noodle drives the `codex` binary, and
# agents.codex.path is a DIRECTORY holding a binary of that name — ours sources
# the Venice key from a 600 file, because Noodle spawns cooks with a scrubbed
# environment.
#
# Model choice is forced by Venice's Responses API, the only dialect Codex speaks:
#   z-ai-glm-5-3-flash  → works (verified: real file-write tool call)
#   claude-opus-5-5     → works
#   kimi-k3             → /responses returns status=incomplete with empty output,
#                         so it cannot drive Codex. Use it through Hermes subagents
#                         (which speak /chat/completions) instead.
[routing.defaults]
provider = "codex"
model = "z-ai-glm-5-3-flash"

[skills]
paths = [".agents/skills"]

[concurrency]
max_concurrency = 3

[agents.codex]
# A DIRECTORY, not a binary. It must contain an executable named `codex`.
path = "/home/vivgates/.local/share/venice-cli/bin"
args = ["-c", "model_provider=venice"]

[adapters.backlog.scripts]
sync = "adapters/backlog-sync"
add = "adapters/backlog-add"
done = "adapters/backlog-done"
edit = "adapters/backlog-edit"
