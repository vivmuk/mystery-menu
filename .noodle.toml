mode = "auto"

# Noodle is the backlog and scheduler of record: todos.md, the skills, the order
# schema. The loop itself is PARKED — Noodle can only drive the Claude and Codex
# CLIs, Claude Code cannot talk to Venice at all, and Codex is not wanted in this
# project. Execution runs instead through Hermes subagents pinned to Venice models
# (delegation.provider=custom, delegation.model=kimi-k3). Do not run `noodle start`
# until a cook of your own choice is wired up.
[routing.defaults]
provider = "codex"
model = "claude-opus-5-5"

[skills]
paths = [".agents/skills"]

[concurrency]
max_concurrency = 3

[agents.codex]
# Execution runs through Venice-pinned Hermes subagents (see docs/DESIGN.md),
# not through a Codex/Claude CLI: Noodle only drives those two, and Claude Code
# cannot talk to Venice at all.
args = ["-c", "model_provider=venice"]

[adapters.backlog.scripts]
sync = "adapters/backlog-sync"
add = "adapters/backlog-add"
done = "adapters/backlog-done"
edit = "adapters/backlog-edit"
