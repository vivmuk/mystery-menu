mode = "auto"

# Execution: Noodle holds the backlog and the method; a Noodle *cook* is a Hermes
# subagent pinned to a Venice model via the chat completions API (delegation.provider
# = custom, delegation.model = kimi-k3; z-ai-glm-5-3-flash for cheap stages).
#
# The loop itself stays PARKED. Noodle drives only the Claude and Codex CLIs: Claude
# Code cannot talk to Venice (no /v1/messages), and Codex, though it works for the
# Venice-hosted Claude models, cannot be driven by kimi-k3 at all — Venice's
# /responses returns status=incomplete with empty output for it, and glm-5-3-flash
# hangs indefinitely through Codex. See the `codex` skill, "Pointing Codex at another
# backend". Do not run `noodle start` until a cook is wired through a CLI that
# actually completes a file-writing task.
[routing.defaults]
provider = "codex"
model = "z-ai-glm-5-3-flash"

[skills]
paths = [".agents/skills"]

[concurrency]
max_concurrency = 3

[agents.codex]
# A DIRECTORY, not a binary. It must contain an executable named `codex`.
path = "/home/vivgates/.local/share/venice-cli/bin"
args = ["-c", "model_provider=venice"]

[adapters.backlog.scripts]
sync = "adapters/backlog-sync"
add = "adapters/backlog-add"
done = "adapters/backlog-done"
edit = "adapters/backlog-edit"
