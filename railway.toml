# Railway runs the whole gate itself: a build that fails typecheck, tests or the
# bundle never reaches production. This replaces GitHub Actions, which the git
# token cannot push to (it lacks the `workflow` scope).
# `--include=dev` is load-bearing: Railway injects NODE_ENV=production into the
# build, and plain `npm ci` then skips every devDependency — leaving no tsc, no
# vite and no vitest, so the gate would fail on its own tools.
[build]
buildCommand = "npm ci --include=dev && npm run typecheck && npm run build && npm test"

[deploy]
startCommand = "npm start"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
